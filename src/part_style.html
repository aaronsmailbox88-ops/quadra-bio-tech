<style>
/* Layout: one-screen-at-a-time app. Sticky top bar, three bottom tabs, each tab shows a short summary first and folds detail behind "More".
   Look (v53): deep-navy "lab" theme — glowing molecular backdrop, two-tone display headers, glass cards. One theme, no light mode. */
:root{
  --bg:#070e24;
  --surface:#0f1b40;
  --surface-2:#172756;
  --ink:#eef3ff;
  --ink-2:#b9c6ea;
  --ink-3:#8292c4;
  --line:rgba(132,165,255,.22);
  --accent:#3d7dff;
  --accent-2:#2a5fe8;
  --accent-ink:#ffffff;
  --accent-soft:rgba(61,125,255,.16);
  --sky:#8ab8ff;
  --gold:#f7c04a;
  --placebo:#4a5a8a;
  --s2:#49d6c8;
  --good:#4ade80; --good-soft:rgba(74,222,128,.14);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --crit:#ff7a7a; --crit-soft:rgba(255,99,99,.16);
  --glow:0 0 22px rgba(61,125,255,.45);
  --grad:linear-gradient(135deg,#4d8bff 0%,#2a5fe8 100%);
  --glass:radial-gradient(90% 70% at 0% 0%, rgba(96,150,255,.20), rgba(96,150,255,0) 55%), linear-gradient(160deg, rgba(27,45,100,.82) 0%, rgba(12,22,56,.90) 100%);
  --hex:url("@@HEXBG@@");
  --display:"Poppins",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Poppins",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:16px;
  --header-h:56px;
  --nav-h:62px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--bg)}
body{
  margin:0; background:transparent; color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:rgba(7,14,36,.92)}
/* the backdrop: beams, glows and the molecular network, fixed behind everything */
.qb-bg{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(70% 45% at 8% -6%, rgba(90,150,255,.42) 0%, rgba(90,150,255,0) 60%),
    radial-gradient(45% 35% at 96% 14%, rgba(73,214,200,.20) 0%, rgba(73,214,200,0) 60%),
    radial-gradient(80% 50% at 50% 108%, rgba(42,95,232,.45) 0%, rgba(42,95,232,0) 60%),
    linear-gradient(180deg,#0a1636 0%,#070e24 45%,#05091b 100%)}
.qb-bg::before{content:""; position:absolute; inset:0; background:var(--hex) center top / cover no-repeat; opacity:.9}
.qb-bg::after{content:""; position:absolute; left:-20%; top:-30%; width:70%; height:90%; background:conic-gradient(from 150deg at 50% 0%, rgba(120,170,255,0) 0deg, rgba(120,170,255,.18) 14deg, rgba(120,170,255,0) 34deg); filter:blur(18px); transform:rotate(-8deg)}

/* Header */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:9;
  background:rgba(7,14,36,.72); -webkit-backdrop-filter:blur(16px) saturate(140%); backdrop-filter:blur(16px) saturate(140%); border-bottom:1px solid rgba(132,165,255,.14);
}
.top-in{
  max-width:680px; margin:0 auto; height:var(--header-h);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.brand{font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.01em; color:#fff; margin:0}
.brand small{display:block; font-family:var(--display); font-weight:600; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--sky); line-height:1.2}
.pill{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  font-family:var(--display); font-size:11px; font-weight:600; color:var(--warn); background:var(--warn-soft);
  border:1px solid rgba(251,191,36,.35); border-radius:999px; padding:5px 10px; letter-spacing:.04em; text-transform:uppercase;
}
.pill::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--warn); box-shadow:0 0 8px var(--warn)}

/* Sub-navigation (per section) */
nav.sub{
  position:sticky; top:calc(var(--header-h) + env(safe-area-inset-top,0px)); z-index:8;
  background:rgba(7,14,36,.72); -webkit-backdrop-filter:blur(16px) saturate(140%); backdrop-filter:blur(16px) saturate(140%); border-bottom:1px solid rgba(132,165,255,.14);
}
nav.sub .in{
  max-width:680px; margin:0 auto; display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  padding:8px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-left,0px));
}
nav.sub .in::-webkit-scrollbar{display:none}
nav.sub button{
  appearance:none; font:inherit; cursor:pointer; flex:0 0 auto; white-space:nowrap;
  font-family:var(--display); font-size:12.5px; font-weight:600; color:#c9d6f7; background:rgba(132,165,255,.10); border:1px solid rgba(132,165,255,.16);
  border-radius:999px; padding:7px 13px; line-height:1.2;
}
nav.sub button[aria-selected="true"]{background:var(--grad); color:#fff; border-color:transparent; box-shadow:var(--glow)}
nav.sub button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:no-preference){ nav.sub button{transition:background .15s,color .15s,box-shadow .15s} }
#mode-title{display:flex; flex-direction:column-reverse}

/* Content */
main{
  max-width:680px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px);
}
section[data-panel]{display:flex; flex-direction:column; gap:16px}
h1{font-family:var(--display); font-weight:800; font-size:clamp(25px,6.6vw,31px); line-height:1.12; letter-spacing:-.02em; margin:0; color:#fff; text-wrap:balance}
h1 .hi{color:var(--gold); font-style:italic; font-weight:800; padding-right:.06em}
h1::after{content:""; display:block; width:54px; height:4px; border-radius:2px; margin-top:12px; background:linear-gradient(90deg,#4d8bff,#49d6c8); box-shadow:0 0 14px rgba(61,125,255,.7)}
h2{font-family:var(--display); font-weight:700; font-size:21px; line-height:1.2; margin:0; color:#fff; letter-spacing:-.01em; text-wrap:balance}
h2 .hi{color:var(--gold); font-style:italic}
h3{font-family:var(--display); font-size:15.5px; font-weight:600; margin:0; color:#fff}
p{margin:0; max-width:62ch}
.lede{font-size:17px; color:var(--ink-2); max-width:58ch}
.eyebrow{font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--sky)}
.eyebrow:has(+ h1),.kick>.eyebrow{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:var(--grad); color:#fff; letter-spacing:.14em; box-shadow:var(--glow); margin-bottom:12px}
.eyebrow:has(+ h1)::before,.kick>.eyebrow::before{content:"\2726"; font-size:10px; opacity:.9}
.kick{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.kick .eyebrow,.kick .eyebrow:has(+ h1){margin-bottom:0}
.kick .tag2{font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#8ef5c0; border:1px solid rgba(74,222,128,.55); border-radius:999px; padding:5px 10px; background:rgba(74,222,128,.10); box-shadow:0 0 14px rgba(74,222,128,.25)}
.kick .tag2::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:#4ade80; margin-right:6px; vertical-align:1px; box-shadow:0 0 8px #4ade80}
a{color:var(--sky)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.card{background:var(--glass); border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; box-shadow:0 12px 34px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.06)}
.card.soft{background:radial-gradient(90% 70% at 0% 0%, rgba(96,150,255,.26), rgba(96,150,255,0) 55%), linear-gradient(160deg, rgba(34,70,170,.70), rgba(20,40,110,.80)); border-color:rgba(132,165,255,.40)}
.card.warn{background:radial-gradient(90% 70% at 0% 0%, rgba(251,191,36,.18), rgba(251,191,36,0) 55%), linear-gradient(160deg, rgba(60,45,20,.85), rgba(30,24,14,.92)); border-color:rgba(251,191,36,.40)}
.card.crit{background:radial-gradient(90% 70% at 0% 0%, rgba(255,99,99,.18), rgba(255,99,99,0) 55%), linear-gradient(160deg, rgba(70,24,30,.85), rgba(36,14,20,.92)); border-color:rgba(255,99,99,.40)}
.card.good{background:radial-gradient(90% 70% at 0% 0%, rgba(74,222,128,.18), rgba(74,222,128,0) 55%), linear-gradient(160deg, rgba(20,60,40,.85), rgba(12,32,24,.92)); border-color:rgba(74,222,128,.40)}

.row{display:grid; gap:10px}
@media (min-width:520px){ .row.two{grid-template-columns:1fr 1fr} .row.three{grid-template-columns:1fr 1fr 1fr} }

/* Stat tiles */
.stat{background:var(--glass); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; min-width:0; box-shadow:0 12px 34px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06)}
.stat .num{font-family:var(--display); font-size:30px; font-weight:800; line-height:1.1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--sky); text-shadow:0 0 18px rgba(138,184,255,.45)}
.stat .lbl{font-size:13px; color:var(--ink-2); margin-top:4px}
.stat .src{font-size:12px; color:var(--ink-3); margin-top:6px}

/* Hormone chips */
.hormones{display:grid; gap:10px}
@media (min-width:520px){ .hormones{grid-template-columns:1fr 1fr 1fr} }
.hormone{background:var(--glass); border:1px solid var(--line); border-radius:var(--radius); padding:14px; min-width:0}
.hormone b{display:block; font-family:var(--display); font-size:14px; font-weight:700; color:var(--sky); margin-bottom:4px}
.hormone span{font-size:14px; color:var(--ink-2)}

/* Timeline of readouts */
.timeline{display:flex; flex-direction:column; gap:0; margin:0; padding:0; list-style:none}
.timeline li{display:grid; grid-template-columns:92px 1fr; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:14px}
.timeline li:first-child{border-top:0; padding-top:0}
.timeline time{font-family:var(--mono); font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.timeline b{font-weight:600}
.timeline span{display:block; color:var(--ink-2)}

/* Bar chart (HTML, to scale) */
.chart{display:flex; flex-direction:column; gap:12px; min-width:0}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--ink-2)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:6px}
.legend .k1 i{background:linear-gradient(90deg,#4d8bff,#49d6c8)} .legend .k2 i{background:var(--placebo)}
.bars{display:flex; flex-direction:column; gap:14px}
.bar-row{display:grid; grid-template-columns:1fr; gap:4px; min-width:0}
.bar-row .name{font-size:14px; font-weight:600; line-height:1.3; color:#fff}
.bar-row .meta{font-size:12px; color:var(--ink-3)}
.track{position:relative; display:flex; flex-direction:column; gap:2px; padding-right:52px}
.bar{position:relative; height:12px; border-radius:0 4px 4px 0; min-width:2px}
.bar.r{background:linear-gradient(90deg,#4d8bff,#49d6c8); box-shadow:0 0 12px rgba(73,214,200,.45)} .bar.p{background:var(--placebo)}
.bar .v{position:absolute; left:100%; top:50%; transform:translateY(-50%); margin-left:6px; font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink-2)}
.bar.r .v{color:#fff; font-weight:500}
.axis{position:relative; height:18px; margin-right:52px; border-top:1px solid var(--line)}
.axis span{position:absolute; top:3px; transform:translateX(-50%); font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.axis span:first-child{transform:none}
.bar:hover::after,.bar:focus-visible::after{
  content:attr(data-tip); position:absolute; left:0; bottom:calc(100% + 6px); z-index:2;
  background:var(--ink); color:var(--bg); font-size:12px; padding:5px 8px; border-radius:6px; white-space:nowrap; font-family:var(--sans)
}
.note{font-size:12.5px; color:var(--ink-3); max-width:62ch}

/* Steps */
.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; counter-reset:step}
.steps li{display:grid; grid-template-columns:32px 1fr; gap:12px; align-items:start}
.steps li::before{counter-increment:step; content:counter(step); width:32px; height:32px; border-radius:50%; background:var(--grad); color:#fff; font-family:var(--display); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 0 16px rgba(61,125,255,.55)}
.steps b{display:block; font-weight:600; color:#fff}
.steps span{font-size:14px; color:var(--ink-2)}

/* Dose ladder */
.ladder{display:flex; align-items:flex-end; gap:6px; min-width:0}
.ladder div{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; font-family:var(--mono); font-size:13px; color:var(--ink-2)}
.ladder i{display:block; width:100%; background:linear-gradient(180deg, rgba(77,139,255,.45), rgba(77,139,255,.08)); border-top:3px solid var(--sky); border-radius:3px 3px 0 0; box-shadow:0 -4px 14px rgba(77,139,255,.25)}
.ladder .t{font-size:11px; color:var(--ink-3); font-family:var(--sans)}

/* Plain lists */
ul.plain{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:15px}
ul.plain li{padding-left:2px}
ul.plain li::marker{color:var(--sky)}
ul.plain.small{font-size:14px; color:var(--ink-2)}

/* Accordion */
details{border:1px solid var(--line); border-radius:var(--radius); background:linear-gradient(160deg, rgba(27,45,100,.55), rgba(12,22,56,.75)); min-width:0}
details summary{cursor:pointer; list-style:none; padding:13px 16px; font-family:var(--display); font-weight:600; font-size:15px; color:#fff; display:flex; justify-content:space-between; align-items:center; gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+"; font-family:var(--mono); color:var(--sky); font-size:18px; line-height:1}
details[open] summary::after{content:"–"}
details .body{padding:0 16px 16px; display:flex; flex-direction:column; gap:10px; font-size:15px; color:var(--ink-2); border-top:1px solid var(--line); padding-top:12px}
details .body p{color:var(--ink-2)}

/* Status strip */
.status{display:flex; flex-direction:column; gap:8px}
.status li{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:baseline; font-size:15px}
.status{list-style:none; margin:0; padding:0}
.tag{font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:999px; white-space:nowrap}
.tag.no{background:var(--crit-soft); color:var(--crit); border:1px solid rgba(255,99,99,.4)} .tag.soon{background:var(--warn-soft); color:var(--warn); border:1px solid rgba(251,191,36,.4)} .tag.ok{background:var(--good-soft); color:var(--good); border:1px solid rgba(74,222,128,.4)}

/* Sources */
.sources{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:13.5px; color:var(--ink-2)}
.sources a{word-break:break-word}

/* Footer */
footer{font-size:12.5px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:14px; max-width:62ch}

/* Blood-level simulator */
.ctl-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; align-items:center}
.ctl-row .lab{font-size:12px; color:var(--ink-3); margin-right:6px}
.seg{display:inline-flex; background:rgba(7,14,36,.6); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px}
.seg button{appearance:none; border:0; background:transparent; font:inherit; font-family:var(--display); font-size:13px; font-weight:600; color:var(--ink-2); padding:6px 10px; border-radius:7px; cursor:pointer; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--grad); color:#fff; box-shadow:0 0 14px rgba(61,125,255,.45)}
.pk{position:relative; width:100%; min-width:0; touch-action:pan-y}
.pk svg{display:block; width:100%; height:auto; overflow:visible}
.pk .grid{stroke:var(--line); stroke-width:1}
.pk .ax{font-size:11px; fill:var(--ink-3); font-family:var(--mono)}
.pk .band-l{font-size:11px; fill:var(--ink-2); font-family:var(--mono); font-weight:500}
.pk .plat{stroke:var(--ink-3); stroke-width:1; stroke-dasharray:4 3}
.pk .ref{stroke:var(--warn); stroke-width:1; stroke-dasharray:2 4}
.pk .plat-l{font-size:11px; fill:var(--ink-3); font-family:var(--sans)}
.pk .area{fill:var(--sky); opacity:.14}
.pk .line{fill:none; stroke:var(--sky); stroke-width:1.8; stroke-linejoin:round; filter:drop-shadow(0 0 6px rgba(138,184,255,.6))}
.pk .tick{stroke:var(--sky); stroke-width:1.5}
.pk .miss{fill:var(--surface); stroke:var(--warn); stroke-width:2}
.pk .miss-l{font-size:11px; fill:var(--warn); font-family:var(--sans); font-weight:600}
.pk .stop{stroke:var(--warn); stroke-width:1.5; stroke-dasharray:4 3}
.pk .cross{stroke:var(--ink-3); stroke-width:1}
.pk .dot{fill:var(--sky); stroke:var(--surface); stroke-width:2}
.pk .tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12px; padding:5px 8px; border-radius:6px; white-space:nowrap; z-index:2; font-family:var(--sans)}
.readout{font-size:14px; color:var(--ink-2); background:rgba(7,14,36,.55); border:1px solid var(--line); border-radius:10px; padding:10px 12px; line-height:1.5}
.readout b{color:#fff}
.readout .flag{color:var(--warn); font-weight:500}
.custom{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; font-size:14px; color:var(--ink-2); background:rgba(7,14,36,.55); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.custom label{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.custom input[type="number"]{width:66px; font:inherit; font-family:var(--mono); font-size:14px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink)}
.custom input[type="checkbox"]{width:16px; height:16px; accent-color:var(--accent)}
.custom .note{flex-basis:100%}

/* Half-life list */
.hl{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.hl li{display:grid; grid-template-columns:1fr auto auto; gap:4px 12px; align-items:baseline; font-size:14px}
.hl .n{font-weight:600; color:#fff} .hl .n small{display:block; font-weight:400; font-size:12px; color:var(--ink-3)}
.hl .v{font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap}
.hl .g{font-size:12px; color:var(--ink-3); white-space:nowrap}
.hl .b{grid-column:1 / -1; height:8px; background:rgba(7,14,36,.6); border-radius:4px; overflow:hidden}
.hl .b i{display:block; height:100%; background:linear-gradient(90deg,#4d8bff,#49d6c8); border-radius:4px; min-width:3px}
.hl li.now .b i{background:linear-gradient(90deg,#fbbf24,#f7c04a)}

/* Tracker */
.card-h{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.card-h .unit{font-family:var(--mono); font-size:12px; color:var(--ink-3)}
.seg.small button{font-size:12px; padding:4px 8px}
.entry{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; align-items:end}
.entry label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-3); min-width:0}
.entry input,.entry select{font:inherit; font-size:16px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:rgba(7,14,36,.6); color:var(--ink); width:100%; min-width:0}
.entry .btn{grid-column:1 / -1; justify-content:center; width:100%; border:0; cursor:pointer; font:inherit; font-weight:600}
.entry .err{grid-column:1 / -1; font-size:13px; color:var(--crit); margin:0}
.entry .err:empty{display:none}
@media (max-width:460px){ .entry{grid-template-columns:1fr 1fr} }
.summ{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
@media (max-width:460px){ .summ{grid-template-columns:1fr 1fr} .summ .stat:first-child{grid-column:1 / -1} }
.summ .stat{padding:10px 12px; background:rgba(7,14,36,.55); border:1px solid var(--line); box-shadow:none}
.summ .num{font-size:24px}
.weeks{width:100%; border-collapse:collapse; font-size:13.5px}
