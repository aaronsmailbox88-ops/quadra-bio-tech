# Rebuilds the app whenever anything under src/ changes, and commits the built files to the repo root,
# which GitHub Pages serves. Edit a file in src/ on github.com, commit, and the live app updates in ~2 minutes.
name: Build the app
on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 src/build.py --site .
      - name: Commit the built app
        run: |
          git config user.name "quadra-bio-tech build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.html manifest.webmanifest sw.js VERSION icon-180.png icon-192.png icon-512.png icon.svg
          if git diff --cached --quiet; then echo "nothing changed"; else git commit -m "Build $(cat VERSION) [skip ci]" && git push; fi
